name: snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Platane/snk@a041d6c27ba561a39f5be9c26a784812765e434b
        id: snake
        with:
          github_user_name: kecebong111
          outputs: |
            dist/github-contribution-grid-snake.svg?palette_color=141414&color_snake=000000

      - uses: crazy-max/ghaction-github-pages@0afef2b761e357e0870be20ef1ed492e0a0b271c
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
